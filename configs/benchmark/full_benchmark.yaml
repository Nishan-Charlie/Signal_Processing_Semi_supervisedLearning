# Full publication-style benchmark grid. Requires the real datasets to be present
# (set the loader `root` paths in the base experiment first). This is large; run on
# GPU and consider `--skip-existing` to resume.
base: configs/experiment/deap_fixmatch.yaml

datasets: [deap]              # add seed, seed_iv, ... once their loaders/roots are set
models: [eegnet, shallowconvnet, eeg_conformer]
methods:
  - supervised
  - pi_model
  - mean_teacher
  - vat
  - ict
  - pseudo_label
  - mixmatch
  - fixmatch
  - flexmatch
  - your_method
label_ratios: [0.01, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5]
seeds: [0, 1, 2, 3, 4]

method_configs:
  fixmatch: configs/method/fixmatch.yaml
  flexmatch: configs/method/flexmatch.yaml
  mean_teacher: configs/method/mean_teacher.yaml
  pseudo_label: configs/method/pseudo_label.yaml
  mixmatch: configs/method/mixmatch.yaml
  vat: configs/method/vat.yaml
  pi_model: configs/method/pi_model.yaml
  ict: configs/method/ict.yaml
  your_method: configs/method/your_method.yaml
