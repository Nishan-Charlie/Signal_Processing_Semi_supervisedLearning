[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssleeg"
version = "0.1.0"
description = "A reproducible benchmark framework for semi-supervised learning on EEG-based emotion recognition."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nishan" }]
keywords = ["EEG", "semi-supervised-learning", "emotion-recognition", "benchmark", "pytorch"]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "tabulate>=0.9",
    "scikit-learn>=1.2",
    "PyYAML>=6.0",
    "tqdm>=4.64",
    "torch>=2.0",
    "tensorboard>=2.12",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scikit-posthocs>=0.7",
]

[project.optional-dependencies]
viz = ["umap-learn>=0.5"]
eeg = ["mne>=1.3"]
wandb = ["wandb>=0.15"]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1", "mypy>=1.0"]

[project.scripts]
ssleeg-train = "ssleeg.cli.train:main"
ssleeg-eval = "ssleeg.cli.evaluate:main"
ssleeg-benchmark = "ssleeg.cli.benchmark:main"
ssleeg-visualize = "ssleeg.cli.visualize:main"
ssleeg-stats = "ssleeg.cli.stats:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
